name: Uno-X benzinpris (hver time)

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  unox:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      UNOX_CLIENT_ID: ${{ secrets.UNOX_CLIENT_ID }}
      UNOX_CLIENT_SECRET: ${{ secrets.UNOX_CLIENT_SECRET }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - name: Tjek om Uno-X-nøglen er sat op
        id: keys
        run: |
          if [ -n "$UNOX_CLIENT_ID" ] && [ -n "$UNOX_CLIENT_SECRET" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "Ingen Uno-X-nøgle endnu – springer over."; fi
      - uses: actions/checkout@v4
        if: steps.keys.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Hent Uno-X-priser
        if: steps.keys.outputs.ok == 'true'
        run: node hent-data.mjs unox --site
      - name: Gem hvis prisen har ændret sig
        id: save
        if: steps.keys.outputs.ok == 'true'
        run: |
          git config user.name "hverdag-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/unox.json
          if git diff --cached --quiet; then echo "Ingen ændring."; exit 0; fi
          git commit -m "Uno-X $(date -u +%FT%H:%MZ)"
          git pull --rebase -X theirs origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: steps.save.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.save.outputs.changed == 'true'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.save.outputs.changed == 'true'
